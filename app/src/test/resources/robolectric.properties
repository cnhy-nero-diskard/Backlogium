# Robolectric 4.15.1 in the current dependency set supports API 35.
sdk=35
# Host unit fixtures own their coordinators/Room/WorkManager lifetimes. Do not boot the production
# Hilt application, which performs startup recovery and can seed encrypted developer credentials.
# Application-startup/device acceptance remains explicit, not a side effect of every unit test.
application=com.example.backlogium.HostUnitTestApplication
