name: Release

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  # Decide whether this tag qualifies for a release:
  #   1. the tagged commit must be contained in the master branch, and
  #   2. the tag must be a valid vX.Y.Z version.
  # A tag push carries no branch, so we resolve branch membership from history.
  gate:
    runs-on: ubuntu-latest
    outputs:
      eligible: ${{ steps.check.outputs.eligible }}
      version_name: ${{ steps.check.outputs.version_name }}
      version_code: ${{ steps.check.outputs.version_code }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # need full history + all branches for containment check

      - name: Evaluate release gates
        id: check
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          echo "Tag: $TAG"

          if [[ ! "$TAG" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "::notice::Tag '$TAG' is not vX.Y.Z — skipping release."
            echo "eligible=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          major="${BASH_REMATCH[1]}"
          minor="${BASH_REMATCH[2]}"
          patch="${BASH_REMATCH[3]}"
          for component_name in major minor patch; do
            component_value="${!component_name}"
            if (( 10#$component_value >= 1000 )); then
              echo "::error::Tag '$TAG' has $component_name component '$component_value'; each component must be below 1000 for the version-code encoding."
              echo "eligible=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          version_name="${TAG#v}"
          version_code=$((10#$major * 1000000 + 10#$minor * 1000 + 10#$patch))
          echo "version_name=$version_name" >> "$GITHUB_OUTPUT"
          echo "version_code=$version_code" >> "$GITHUB_OUTPUT"
          # Is the tagged commit reachable from origin/master?
          SHA="$(git rev-list -n 1 "$TAG")"
          if git merge-base --is-ancestor "$SHA" origin/master; then
            echo "::notice::'$TAG' (@$SHA) is on master — proceeding with the release build."
            echo "eligible=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::'$TAG' (@$SHA) is not contained in master — skipping release."
            echo "eligible=false" >> "$GITHUB_OUTPUT"
          fi

  release:
    needs: gate
    if: needs.gate.outputs.eligible == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write  # required to create the GitHub Release
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run unit tests
        run: ./gradlew test

      - name: Decode release keystore
        id: keystore
        run: |
          set -euo pipefail
          KEYSTORE_PATH="$RUNNER_TEMP/release.keystore.jks"
          echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 -d > "$KEYSTORE_PATH"
          echo "path=$KEYSTORE_PATH" >> "$GITHUB_OUTPUT"

      - name: Assemble release APK
        env:
          RELEASE_KEYSTORE_PATH: ${{ steps.keystore.outputs.path }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          VERSION_NAME: ${{ needs.gate.outputs.version_name }}
          VERSION_CODE: ${{ needs.gate.outputs.version_code }}
        run: ./gradlew assembleRelease -PversionName="$VERSION_NAME" -PversionCode="$VERSION_CODE"

      - name: Collect APK
        id: apk
        run: |
          set -euo pipefail
          APK="$(find app/build/outputs/apk/release -name '*.apk' | head -n1)"
          if [[ -z "$APK" ]]; then
            echo "No release APK found." >&2
            exit 1
          fi
          echo "path=$APK" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: ${{ steps.apk.outputs.path }}
