name: Release

run-name: Backlogium release ${{ github.ref_name }}

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  # Decide whether this tag qualifies for a release:
  #   1. the tagged commit must be contained in the master branch, and
  #   2. the tag must be a valid vX.Y.Z version.
  # A tag push carries no branch, so we resolve branch membership from history.
  gate:
    name: Validate Backlogium release ${{ github.ref_name }}
    runs-on: ubuntu-latest
    outputs:
      eligible: ${{ steps.check.outputs.eligible }}
      version_name: ${{ steps.check.outputs.version_name }}
      version_code: ${{ steps.check.outputs.version_code }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # need full history + all branches for containment check

      - name: Evaluate release gates
        id: check
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          echo "Tag: $TAG"

          if [[ ! "$TAG" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "::notice::Tag '$TAG' is not vX.Y.Z — skipping release."
            echo "eligible=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          version_name="${TAG#v}"
          if ! version_code="$(bash scripts/encode-version.sh "$TAG")"; then
            echo "::error::Tag '$TAG' cannot be encoded as an Android version code."
            echo "eligible=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "version_name=$version_name" >> "$GITHUB_OUTPUT"
          echo "version_code=$version_code" >> "$GITHUB_OUTPUT"
          # Is the tagged commit reachable from origin/master?
          SHA="$(git rev-list -n 1 "$TAG")"
          if git merge-base --is-ancestor "$SHA" origin/master; then
            echo "::notice::'$TAG' (@$SHA) is on master — proceeding with the release build."
            echo "eligible=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::'$TAG' (@$SHA) is not contained in master — skipping release."
            echo "eligible=false" >> "$GITHUB_OUTPUT"
          fi

  release:
    name: Publish Backlogium release ${{ github.ref_name }}
    needs: gate
    if: needs.gate.outputs.eligible == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write  # required to create the GitHub Release
      pull-requests: read  # collect_release_metadata.py reads commits/{sha}/pulls
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve previous release and collect pull requests
        id: metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 scripts/collect_release_metadata.py \
            --repository "$GITHUB_REPOSITORY" \
            --current-tag "$GITHUB_REF_NAME" \
            --current-sha "$(git rev-list -n 1 "$GITHUB_REF_NAME")" \
            --output "$RUNNER_TEMP/release-pull-requests.json" \
            --github-output "$GITHUB_OUTPUT"

      - name: Compose and validate release notes
        id: notes
        env:
          CURRENT_TAG: ${{ github.ref_name }}
          PREVIOUS_TAG: ${{ steps.metadata.outputs.previous_tag }}
        run: |
          set -euo pipefail
          CURRENT_SHA="$(git rev-list -n 1 "$CURRENT_TAG")"
          PREVIOUS_SHA=""
          if [[ -n "$PREVIOUS_TAG" ]]; then
            PREVIOUS_SHA="$(git rev-list -n 1 "$PREVIOUS_TAG")"
          fi
          VERSION_NAME="${CURRENT_TAG#v}"
          MARKDOWN_PATH="$RUNNER_TEMP/Backlogium-${VERSION_NAME}-release-notes.md"
          JSON_PATH="$RUNNER_TEMP/Backlogium-${VERSION_NAME}-release-notes.json"
          python3 scripts/release_notes.py compose \
            --current-tag "$CURRENT_TAG" \
            --previous-tag "$PREVIOUS_TAG" \
            --current-sha "$CURRENT_SHA" \
            --previous-sha "$PREVIOUS_SHA" \
            --prs-file "$RUNNER_TEMP/release-pull-requests.json" \
            --markdown-output "$MARKDOWN_PATH" \
            --json-output "$JSON_PATH"
          python3 scripts/release_notes.py validate \
            --expected-tag "$CURRENT_TAG" \
            --markdown-input "$MARKDOWN_PATH" \
            --json-input "$JSON_PATH"
          echo "markdown_path=$MARKDOWN_PATH" >> "$GITHUB_OUTPUT"
          echo "json_path=$JSON_PATH" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run unit tests
        run: ./gradlew test

      - name: Decode release keystore
        id: keystore
        run: |
          set -euo pipefail
          KEYSTORE_PATH="$RUNNER_TEMP/release.keystore.jks"
          echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 -d > "$KEYSTORE_PATH"
          echo "path=$KEYSTORE_PATH" >> "$GITHUB_OUTPUT"

      - name: Assemble release APK
        env:
          RELEASE_KEYSTORE_PATH: ${{ steps.keystore.outputs.path }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          VERSION_NAME: ${{ needs.gate.outputs.version_name }}
          VERSION_CODE: ${{ needs.gate.outputs.version_code }}
        run: ./gradlew assembleRelease -PversionName="$VERSION_NAME" -PversionCode="$VERSION_CODE"

      - name: Collect APK
        id: apk
        run: |
          set -euo pipefail
          APK="$(find app/build/outputs/apk/release -name '*.apk' | head -n1)"
          if [[ -z "$APK" ]]; then
            echo "No release APK found." >&2
            exit 1
          fi
          VERSIONED_APK="$RUNNER_TEMP/Backlogium-${{ needs.gate.outputs.version_name }}.apk"
          mv "$APK" "$VERSIONED_APK"
          echo "path=$VERSIONED_APK" >> "$GITHUB_OUTPUT"

      - name: Create APK checksum
        id: checksum
        run: |
          set -euo pipefail
          APK="${{ steps.apk.outputs.path }}"
          CHECKSUM="${APK}.sha256"
          sha256sum "$APK" | awk '{print $1}' > "$CHECKSUM"
          test "$(wc -c < "$CHECKSUM")" -eq 65
          echo "path=$CHECKSUM" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Backlogium ${{ needs.gate.outputs.version_name }}
          tag_name: ${{ github.ref_name }}
          body_path: ${{ steps.notes.outputs.markdown_path }}
          files: |
            ${{ steps.apk.outputs.path }}
            ${{ steps.checksum.outputs.path }}
            ${{ steps.notes.outputs.json_path }}
