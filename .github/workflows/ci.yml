name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  route:
    name: Route pull request checks
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      routing: ${{ steps.route.outputs.routing }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Classify the complete pull request diff
        id: route
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 scripts/ci_routing.py

  test:
    name: Android unit tests
    needs: route
    if: >-
      ${{ !cancelled() && (github.event_name == 'push' ||
      (needs.route.result == 'success' && fromJSON(needs.route.outputs.routing).jobs.test)) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # Robolectric downloads Android runtimes outside Gradle's dependency cache.
      - name: Cache Robolectric runtimes
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository/org/robolectric
          key: robolectric-v1-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml', 'app/src/test/resources/robolectric.properties') }}

      - name: Run unit tests
        run: ./gradlew test

      - name: Compile release Kotlin
        run: ./gradlew :app:compileReleaseKotlin

      - name: Assemble the instrumentation APK
        run: ./gradlew :app:assembleDebugAndroidTest

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            **/build/reports/tests/
            **/build/test-results/

  visual-regression:
    name: Compose screenshot verification
    needs: route
    if: >-
      ${{ !cancelled() && (github.event_name == 'push' ||
      (needs.route.result == 'success' && fromJSON(needs.route.outputs.routing).jobs['visual-regression'])) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # Share the same runtime cache with unit tests instead of downloading on every run.
      - name: Cache Robolectric runtimes
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository/org/robolectric
          key: robolectric-v1-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml', 'app/src/test/resources/robolectric.properties') }}

      - name: Compile unit test sources
        run: ./gradlew :app:compileDebugUnitTestKotlin

      - name: Verify tracked screenshots
        run: >-
          ./gradlew :app:verifyRoborazziDebug
          --tests com.example.backlogium.ui.screenshot.RoborazziSpikeTest
          --tests com.example.backlogium.ui.screenshot.DeadlineArchiveScreenshotTest
          --tests com.example.backlogium.ui.screenshot.MainScreenScreenshotNarrowTest
          --tests com.example.backlogium.ui.screenshot.MainScreenScreenshotStandardTest
          --tests com.example.backlogium.ui.screenshot.GameDetailScreenshotNarrowTest
          --tests com.example.backlogium.ui.screenshot.GameDetailScreenshotStandardTest
          --tests com.example.backlogium.ui.screenshot.SetupRecoveryScreenshotNarrowTest
          --tests com.example.backlogium.ui.screenshot.SetupRecoveryScreenshotStandardTest
          --tests com.example.backlogium.ui.screenshot.SyncFeedbackScreenshotNarrowTest
          --tests com.example.backlogium.ui.screenshot.SyncFeedbackScreenshotStandardTest
          --tests com.example.backlogium.ui.analytics.CorePlayInsightsUiTest

      - name: Upload Roborazzi failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: roborazzi-visual-regression-${{ github.run_id }}
          if-no-files-found: warn
          path: |
            app/src/test/snapshots/
            app/build/outputs/roborazzi/compare/
            app/build/test-results/roborazzi/
            app/build/reports/roborazzi/
            app/build/test-results/testDebugUnitTest/
            app/build/reports/tests/testDebugUnitTest/

  lint:
    name: Android lint
    needs: route
    if: >-
      ${{ !cancelled() && (github.event_name == 'push' ||
      (needs.route.result == 'success' && fromJSON(needs.route.outputs.routing).jobs.lint)) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run Android lint
        run: ./gradlew lintDebug

  # This job is intentionally independent from unit tests and lint. The API,
  # system image, architecture, and device profile are pinned so migration
  # coverage does not silently drift with the hosted runner image.
  instrumented:
    name: Room migration tests
    needs: route
    if: >-
      ${{ !cancelled() && (github.event_name == 'push' ||
      (needs.route.result == 'success' && fromJSON(needs.route.outputs.routing).jobs.instrumented)) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Cache pinned Android emulator
        uses: actions/cache@v4
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: android-avd-api35-google-apis-x86_64-pixel2-v2-${{ runner.os }}

      - name: Run instrumented tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          disable-animations: true
          script: ./gradlew :app:connectedDebugAndroidTest '-Pandroid.testInstrumentationRunnerArguments.class=com.example.backlogium.data.local.MigrationTest'

  # The release-note composer is not part of the Android build: no Gradle task exercises it, so
  # nothing above would catch a regression in it. It decides what users read in the update sheet,
  # and release_notes.py's check subcommand now gates pull requests, so its unit tests need a job
  # of their own.
  scripts:
    name: Release-note tooling tests
    needs: route
    if: >-
      ${{ !cancelled() && (github.event_name == 'push' ||
      (needs.route.result == 'success' && fromJSON(needs.route.outputs.routing).jobs.scripts)) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Run script unit tests
        run: python -m unittest discover -v
        working-directory: scripts

  # functions/ is a fully independent build system — invisible to Gradle, so the
  # Android job above never typechecks it. Without this job a breaking change to
  # functions/src/*.ts merges green. Separate job, not a step: the two toolchains
  # share nothing and should fail independently.
  functions:
    name: Cloud functions typecheck
    needs: route
    if: >-
      ${{ !cancelled() && (github.event_name == 'push' ||
      (needs.route.result == 'success' && fromJSON(needs.route.outputs.routing).jobs.functions)) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          # Matches functions/package.json "engines.node" and the Cloud Functions runtime.
          node-version: '22'
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: functions

      - name: Typecheck and compile
        run: npm run build
        working-directory: functions

      - name: Run tests
        run: npm test
        working-directory: functions

  openspec:
    name: OpenSpec validation
    needs: route
    if: >-
      ${{ github.event_name == 'pull_request' && needs.route.result == 'success' &&
      fromJSON(needs.route.outputs.routing).jobs.openspec }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install pinned OpenSpec CLI
        run: npm install --global @fission-ai/openspec@1.16.0

      - name: Validate specs and touched changes
        env:
          ROUTING: ${{ needs.route.outputs.routing }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import subprocess
          import sys

          # Legacy strict findings remain, so only touched active changes use strict mode.
          checks = [["--all", "--no-interactive"]]
          checks.extend(["--strict", "--", change] for change in json.loads(os.environ["ROUTING"])["changes"])
          results = [subprocess.run(["openspec", "validate", *args]).returncode for args in checks]
          sys.exit(any(results))
          PY

  result:
    name: CI result
    if: ${{ always() }}
    needs: [route, test, visual-regression, lint, instrumented, scripts, functions, openspec]
    runs-on: ubuntu-latest
    steps:
      - name: Check required job outcomes
        env:
          EVENT: ${{ github.event_name }}
          NEEDS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          report=$(jq -ce --arg event "$EVENT" '
            . as $needs
            | (keys - ["route"]) as $jobs
            | (if $event == "push" and .route.result == "skipped" then
                 [$jobs[] | {key: ., value: (. != "openspec")}] | from_entries
               elif $event == "pull_request" and .route.result == "success" then
                 (.route.outputs.routing | fromjson)
                 | if type == "object" and keys == ["changes", "jobs"]
                      and (.jobs | type == "object" and keys == $jobs and all(.[]; type == "boolean"))
                      and (.changes | type == "array" and all(.[]; type == "string" and length > 0))
                      and (.jobs.openspec or .changes == [])
                   then .jobs else error("Invalid pull request routing outputs") end
               else error("Unexpected routing result: " + (.route.result // "missing"))
               end) as $selected
            | [$jobs[] as $job | {
                job: $job,
                actual: $needs[$job].result,
                expected: (if $selected[$job] then "success" else "skipped" end)
              }]
          ' <<< "$NEEDS")
          jq -r '.[] | "\(.job): \(.actual) (expected \(.expected))"' <<< "$report"
          jq -e 'all(.[]; .actual == .expected)' <<< "$report"
