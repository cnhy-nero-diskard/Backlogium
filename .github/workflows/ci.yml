name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    name: Android unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run unit tests
        run: ./gradlew test

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: '**/build/reports/tests/'

  visual-regression:
    name: Compose screenshot verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Compile unit test sources
        run: ./gradlew :app:compileDebugUnitTestKotlin

      - name: Verify tracked screenshots
        run: >-
          ./gradlew :app:verifyRoborazziDebug
          --tests com.example.backlogium.ui.screenshot.RoborazziSpikeTest
          --tests com.example.backlogium.ui.screenshot.MainScreenScreenshotNarrowTest
          --tests com.example.backlogium.ui.screenshot.MainScreenScreenshotStandardTest

      - name: Upload Roborazzi failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: roborazzi-visual-regression-${{ github.run_id }}
          if-no-files-found: warn
          path: |
            app/src/test/snapshots/
            app/build/outputs/roborazzi/compare/
            app/build/test-results/roborazzi/
            app/build/reports/roborazzi/

  lint:
    name: Android lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run Android lint
        run: ./gradlew lintDebug

  # This job is intentionally independent from unit tests and lint. The API,
  # system image, architecture, and device profile are pinned so migration
  # coverage does not silently drift with the hosted runner image.
  instrumented:
    name: Android instrumented tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Cache pinned Android emulator
        uses: actions/cache@v4
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: android-avd-api35-google-apis-x86_64-pixel2-v2-${{ runner.os }}

      - name: Run instrumented tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          disable-animations: true
          script: ./gradlew :app:connectedDebugAndroidTest '-Pandroid.testInstrumentationRunnerArguments.class=com.example.backlogium.data.local.MigrationTest'

  # The release-note composer is not part of the Android build: no Gradle task exercises it, so
  # nothing above would catch a regression in it. It decides what users read in the update sheet,
  # and release_notes.py's check subcommand now gates pull requests, so its unit tests need a job
  # of their own.
  scripts:
    name: Release-note tooling tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Run script unit tests
        run: python -m unittest discover -v
        working-directory: scripts

  # functions/ is a fully independent build system — invisible to Gradle, so the
  # Android job above never typechecks it. Without this job a breaking change to
  # functions/src/*.ts merges green. Separate job, not a step: the two toolchains
  # share nothing and should fail independently.
  functions:
    name: Cloud functions typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          # Matches functions/package.json "engines.node" and the Cloud Functions runtime.
          node-version: '22'
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: functions

      - name: Typecheck and compile
        run: npm run build
        working-directory: functions

      - name: Run tests
        run: npm test
        working-directory: functions
